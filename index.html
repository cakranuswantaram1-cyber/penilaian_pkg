didik, d) dapat dilaksanakan di kelas, dan e) sesuai dengan konteks kehidupan sehari-hari peserta didik", "b": ["Dokumen RPP", "KI dan KD sesuai mata pelajaran"]}]}, {"no": 4, "nama": "Kegiatan pembelajaran yang mendidik", "ind": [{"t": "Guru melaksanakan aktivitas pembelajaran sesuai dengan rancangan yang telah disusun secara lengkap (termasuk pemberian informasi baru) yang mengindikasikan bahwa guru mengerti tentang tujuannya", "b": ["Dokumen RPP", "Dokumen supervisi akademik pelaksanaan pembelajaran"]}, {"t": "Guru melaksanakan aktivitas pembelajaran yang bertujuan untuk membantu proses belajar peserta didik, bukan untuk menguji sehingga membuat peserta didik merasa tertekan", "b": []}, {"t": "Guru menyikapi kesalahan yang dilakukan peserta didik sebagai tahapan proses pembelajaran, bukan semata-mata kesalahan yang harus dikoreksi. Misalnya : Dengan mengetahui terlebih dahulu peserta didik lain yang setuju / tidak setuju dengan jawaban tersebut, sebelum memberikan penjelasan tentang jawaban yang benar", "b": ["Dokumen supervisi akademik (fokus kepada tahapan pembelajaran)", "Pengamatan di kelas dalam pelaksanaan pembelajaran"]}, {"t": "Guru melaksanakan kegiatan pembelajaran sesuai isi kurikulum dan mengaitkannya dengan konteks kehidupan sehari-hari peserta didik", "b": ["Dokumen supervisi akademik pelaksanaan pembelajaran (fokus kepada materi pokok yang disampaikan)", "KI dan KD mata pelajaran", "RPP (fokus kepada materi pokok)", "Pengamatan di kelas dalam pelaksanaan pembelajaran"]}, {"t": "Guru melakukan aktivitas pembelajaran secara bervariasi dengan mempetimbangkan waktu, kondisi kelas, usia dan tingkat kemampuan belajar serta mempertahankan perhatian peserta didik", "b": ["Dokumen supervisi akademik pelaksanaan pembelajaran (fokus kepada metode pembelajaran dan penggunaan alokasi waktu)", "Dokumen RPP (fokus kepada metode pembelajaran)", "Pengamatan di kelas dalam pelaksanaan pembelajaran"]}, {"t": "Guru mengelola kelas dengan efektif tanpa mendominasi atau  di kelas", "Telaah hasil supervisi akademik pelaksanaan pembelajaran (fokus kepada interaksi guru dengan peserta didik)"]}, {"t": "Guru menyajikan kegiatan pembelajaran yang dapat menumbuhkan kerja sama yang baik antar peserta didik", "b": ["Pengamatan pelaksanaan pembelajaran di kelas", "Telaah hasil supervisi akademik pelaksanaan pembelajaran (fokus kepada interaksi guru dengan peserta didik)"]}, {"t": "Guru mendengarkan dan memberikan perhatian terhadap semua jawaban peserta didik baik yang benar maupun yang dianggap salah untuk mengukur tingkat pemahaman peserta didik", "b": ["Pengamatan pelaksanaan pembelajaran di kelas", "Telaah hasil supervisi akademik pelaksanaan pembelajaran (fokus kepada interaksi guru dengan peserta didik)"]}]}, {"no": 7, "nama": "Penilaian dan evaluasi", "ind": [{"t": "Guru menyusun alat penilaian yang sesuai dengan tujuan pembelajaran untuk mencapai kompetensi tertentu seperti yang tertulis dalam RPP", "b": ["Dokumen RPP (fokus kepada tujuan pembelajaran dan penilaian / assesmen)", "Perangkat penilaian (sebaran soal, kisi-kisi soal / kartu soal)", "Analisis hasil penilaian (analisis ketuntasan / daya serap)"]}, {"t": "Guru melaksanakan penilaian dengan berbagai teknik dan jenis penilaian, selain penilaian formal yang dilaksanakan madrasah, dan mengumumkan hasil serta implikasinya kepada peserta didik, tentang tingkat pemahaman terhadap materi pembelajaran yang telah dan akan dipelajari", "b": ["Perangkat penilaian (sebaran soal, kisi-kisi soal / kartu soal)", "Analisis hasil penilaian (analisis ketuntasan / daya serap)", "Lembar jawaban tes yang sudah ditandatangani orang tua peserta didik", "Rekap nilai (buku leger)"]}, {"t": "Guru menganalisis hasil penilaian untuk mengidentifikasi topik / kompetensi dasar yang sulit sehingga diketahui kekuatan dan kelemahan masing-masing peserta didik untuk keperluan remedial dan pengayaan", "b": ["Dokumen RPP (fokus kepada tujuan pembelajaran dan penilaian / assesmen)", "Perangkat penilaian (sebaran soal, kisi-kisi soal / kartu soal)", "Analisis hasil penilaian (analisis ketuntasan / daya serap)", "Program remedial dan pengayaan"]}, {"t": "Guru memanfaatkan masukan dari peserta didik dan merefleksikannya untuk meningkatkan pembelajaran selanjutnya, dan dapat membuktikannya melalui catatan, jurnal pembelajaran, rancangan pembelajaran, materi tambahan, dan sebagainya", "b": ["Perangkat penilaian (sebaran soal, kisi-kisi soal / kartu soal)", "Analisis hasil penilaian (analisis ketuntasan / daya serap)", "Program remedial dan pengayaan", "Jurnal pembelajaran"]}]}, {"no": 8, "nama": "Bertindak sesuai dengan norma agama, hukum, sosial, dan kebudayaan nasional", "ind": [{"t": "Guru menghargai dan mempromosikan prinsip-prinsip Pancasila sebagai dasar ideologi dan etik bagi semua warga Indonesia", "b": ["Dokumentasi kegiatan upacara bendera / PHBN (foto kegiatan, daftar hadir, surat tugas pembina upacara, dll.)", "Surat pernyataan tidak terlibat dalam organisasi terlarang oleh pemerintah", "Wawancara dengan guru / kepala madrasah"]}, {"t": "Guru mengembangkan kerja sama dan membina kebersamaan dengan teman sejawat tanpa memperhatikan perbedaan yang ada (misalnya : suku, agama, dan gender)", "b": ["Mengikuti kegiatanguru dalam MGMP / KKG / organisasi guru lainnya", "Foto kegiatan guru-guru", "Wawancara dengan guru / kepala madrasah"]}]}, {"no": 9, "nama": "Menunjukkan pribadi yang dewasa dan teladan", "ind": [{"t": "Guru bertingkah laku santun dalam berbicara, bepenampilan sopan terhadap semua peserta didik, orang tua, dan teman sejawat", "b": ["Wawancara dengan guru / teman sejawat atau kepala madrasah", "Daftar hadir guru dalam melaksanakan tugas pokok (rekap daftar hadir guru)", "Keaktifan di KKG/MGMP"]}, {"t": "Guru mau berbagi pengalaman dengan kolega, termasuk mengundang mereka untuk mengobservasi cara mengajarnya dan memberikan masukan", "b": ["Wawancara dengan guru / teman sejawat atau kepala madrasah", "Daftar hadir guru dalam melaksanakan tugas pokok (rekap daftar hadir guru)", "Catatan hasil supervisi pelaksanaan pembelajaran (laporan supervisi pelaksanaan pembelajaran)", "Keaktifan di KKG/MGMP"]}, {"t": "Guru mampu mengelola pembelajaran yang membuktikan bahwa guru dihormati oleh peserta didik, sehingga semua peserta didik selalu memperhatika guru dan berpartisipasi aktif dalam proses pembelajaran", "b": ["Wawancara dengan guru / teman sejawat atau kepala madrasah", "Daftar hadir guru dalam melaksanakan tugas pokok (rekap daftar hadir guru)", "Catatan hasil supervisi pelaksanaan pembelajaran (laporan supervisi pelaksanaan pembelajaran)"]}, {"t": "Guru bersikap dewasa dalam menerima masukan dari peserta didik", "b": ["Wawancara dengan guru / teman sejawat atau kepala madrasah", "Daftar hadir guru dalam melaksanakan tugas pokok (rekap daftar hadir guru)", "Catatan hasil supervisi pelaksanaan pembelajaran (laporan supervisi pelaksanaan pembelajaran)"]}, {"t": "Guru berperilaku baik untuk mencitrakan nama baik madrasah", "b": ["Wawancara dengan guru / teman sejawat atau kepala madrasah", "Daftar hadir guru dalam melaksanakan tugas pokok (rekap daftar hadir guru)", "Catatan hasil supervisi pelaksanaan pembelajaran (laporan supervisi pelaksanaan pembelajaran)", "Keaktifan di KKG/MGMP"]}]}, {"no": 10, "nama": "Etos kerja, tanggung jawab yang tinggi, rasa bangga menjadi guru", "ind": [{"t": "Guru mengawali dan mengakhiri pembelajaran dengan tepat waktu", "b": ["Daftar hadir guru", "Telaah dokumen hasil supervisi akademik pelaksanaan pembelajaran (fokus menggunakan alokasi waktu dengan baik)", "Kunjungan kelas memantau guru melaksanakan pembelajaran"]}, {"t": "Jika guru harus meninggalkan kelas, guru mengaktifkan peserta didik dengan melakukan hal-hal produktif terkait dengan mata pelajaran, dan meminta guru piket atau guru lain untuk mengawasi kelas", "b": ["Daftar hadir guru", "Surat keterangan / surat cuti / surat tugas", "Catatan piket madrasah"]}, {"t": "Guru memenuhi jam mengajar dan dapat melakukan semua kegiatan lain d V.ie=()=>{const df=sameDef(),n=nInd();
return`<div class="gr"><div><h2>Kelola Instrumen</h2><small>Edit, tambah, hapus, dan urutkan komponen &amp; indikator</small></div><div class="row" style="margin:0"><button class="btn" data-a="go" data-v="i">← Kembali ke Penilaian</button></div></div>
<div class="g4" style="margin-bottom:14px"><div class="card st"><small>Komponen</small><b>${D.length}</b></div><div class="card st"><small>Indikator</small><b>${n}</b></div><div class="card st"><small>Skor maksimal</small><b>${D.length*4}</b><small>poin (${D.length}×4)</small></div><div class="card st"><small>Status</small><b style="font-size:17px">${sameDef()?"Bawaan":"Disesuaikan"}</b></div></div>
<div class="card"><p class="warn" style="margin:0 0 10px">Perubahan langsung tersimpan dan berlaku untuk <b>semua guru</b>. Menghapus komponen/indikator ikut menghapus nilai yang sudah diisi pada item itu. Tombol ↶ Urungkan di atas masih bisa dipakai.</p>
<small>${df?"":"Instrumen atau rumus sudah diubah, jadi <b>Cetak Original (Excel)</b> dinonaktifkan dan dokumen dicetak dengan gaya Modern. Impor Excel PKG_Mapel juga hanya cocok untuk instrumen bawaan."}</small>
<div class="row">${KM.map((m,g)=>`<button class="btn s p" data-a="ieAddC" data-v="${g}">+ Komponen ${m}</button>`).join("")}</div>
<div class="row"><button class="btn s" data-a="ieExp">⬇ Ekspor Instrumen</button><button class="btn s" data-a="ieImp">⬆ Impor Instrumen</button><button class="btn s" data-a="ieReset"${S.inst?"":" disabled"}>Pulihkan Instrumen Bawaan</button></div></div>
${KM.map((m,g)=>`<h3 style="margin:20px 0 4px">${"ABCD"[g]}. ${m}</h3>${M.map((c,ci)=>[c,ci]).filter(x=>x[0].g==g).map(([c,ci])=>{const gi=M.filter(x=>x.g==g),pos=gi.indexOf(c);return`<details class="ke" data-kid="${c.id}"${ieOpen.has(c.id)?" open":""}><summary><span>K${ci+1}. ${esc(c.nama)||"(tanpa nama)"}</span><small>${c.ind.length} indikator</small></summary><div class="kb">
<div class="kh"><label>Nama komponen<input data-ie="cn" data-ci="${c.id}" value="${esc(c.nama)}"></label><label style="flex:0 0 160px">Kelompok<select data-ie="cg" data-ci="${c.id}">${KM.map((k,x)=>`<option value="${x}"${x==c.g?" selected":""}>${k}</option>`).join("")}</select></label>
<button class="btn s" data-a="ieMC" data-v="${c.id}|-1"${pos==0?" disabled":""}>↑</button><button class="btn s" data-a="ieMC" data-v="${c.id}|1"${pos==gi.length-1?" disabled":""}>↓</button><button class="btn s d" data-a="ieDC" data-v="${c.id}">Hapus komponen</button></div>
${c.ind.map((d,ii)=>`<div class="ied"><div class="ih"><span class="num">${ii+1}</span><textarea data-ie="it" data-ci="${c.id}" data-ii="${d.id}" placeholder="Bunyi indikator kinerja">${esc(d.t)}</textarea><div class="ia"><button class="btn s" data-a="ieMI" data-v="${c.id}|${d.id}|-1"${ii==0?" disabled":""}>↑</button><button class="btn s" data-a="ieMI" data-v="${c.id}|${d.id}|1"${ii==c.ind.length-1?" disabled":""}>↓</button><button class="btn s d" data-a="ieDI" data-v="${c.id}|${d.id}">Hapus</button></div></div>
<div class="ib"><small>Bukti kinerja (${d.b.length})</small>${d.b.map(b=>`<div class="br3"><input data-ie="bt" data-ci="${c.id}" data-ii="${d.id}" data-bi="${b.id}" value="${esc(b.s)}" placeholder="Bukti kinerja"><button class="btn s d" data-a="ieDB" data-v="${c.id}|${d.id}|${b.id}" title="Hapus bukti">×</button></div>`).join("")}<button class="btn s" data-a="ieAB" data-v="${c.id}|${d.id}">+ Bukti</button></div></div>`).join("")}
<div class="row"><button class="btn s p" data-a="ieAI" data-v="${c.id}">+ Tambah Indikator</button></div></div></details>`}).join("")}`).join("")}
${rmCard()}`};
document.addEventListener("toggle",e=>{const d=e.target;if(d.classList&&d.classList.contains("ke")){d.open?ieOpen.add(d.dataset.kid):ieOpen.delete(d.dataset.kid)}},true);
/* ---------- edit teks langsung ---------- */
document.addEventListener("input",e=>{const t=e.target,d=t.dataset;if(!d||!d.ie)return;const c=fc(M,d.ci);if(!c)return;touch();if(d.ie=="cn")c.nama=t.value;else{const i=fi(c,d.ii);if(!i)return;if(d.ie=="it")i.t=t.value;else{const b=i.b.find(x=>x.id==d.bi);if(b)b.s=t.value}}build();save("inst"+(d.bi||d.ii||d.ci))});
document.addEventListener("change",e=>{const t=e.target,d=t.dataset;if(!d)return;
if(d.ie=="cg"){const g=+t.value;if(!confirm("Pindahkan komponen ini ke kelompok "+KM[g]+"?")){draw();return}commit(m=>{const c=fc(m,d.ci);if(m.filter(x=>x.g==c.g).length<2){toast("Kelompok harus punya minimal 1 komponen");return false}c.g=g;ieOpen.add(c.id)},"Komponen dipindahkan")}
else if(d.rm){const r=clone(rm()),g=d.rm.slice(0,2),i=+d.rm.slice(2),v=parseFloat(t.value);r[g][i]=v;const ok=isFinite(v)&&v>0&&(g=="pk"||(r[g].every((x,j)=>j==0||x>r[g][j-1])&&(g!="lv"||r.lv[2]<100)&&(g!="sb"||r.sb[3]<100)));if(!ok){toast("Nilai tidak valid — batas harus naik berurutan (mis. 25 < 50 < 75)");draw();return}S.cfg.rm=r;save();draw();toast("Rumus diperbarui, semua nilai dihitung ulang")}});
/* ---------- aksi ---------- */
Object.assign(A,{
ieAddC(g){commit(m=>{const id=uid2();m.push({id,nama:"Komponen baru",g:+g,ind:[{id:uid2(),t:"Indikator baru",b:[{id:uid2(),s:"Bukti kinerja"}]}]});ieOpen.add(id)},"Komponen ditambahkan")},
ieDC(id){const c=fc(M,id);if(M.filter(x=>x.g==c.g).length<2)return toast("Kelompok "+KM[c.g]+" harus punya minimal 1 komponen");const f=m=>{m.splice(m.findIndex(x=>x.id==id),1)};if(!confirmLoss(f,"Hapus komponen \""+c.nama+"\" beserta "+c.ind.length+" indikatornya?"))return;commit(f,"Komponen dihapus")},
ieMC(v){const[id,d]=v.split("|");commit(m=>{const c=fc(m,id),grp=m.filter(x=>x.g==c.g),p=grp.indexOf(c),o=grp[p+ +d];if(!o)return false;const a=m.indexOf(c),b=m.indexOf(o);[m[a],m[b]]=[m[b],m[a]];ieOpen.add(id)})},
ieAI(id){commit(m=>{fc(m,id).ind.push({id:uid2(),t:"Indikator baru",b:[{id:uid2(),s:"Bukti kinerja"}]});ieOpen.add(id)},"Indikator ditambahkan")},
ieDI(v){const[cid,iid]=v.split("|"),c=fc(M,cid);if(c.ind.length<2)return toast("Komponen harus punya minimal 1 indikator");const f=m=>{const k=fc(m,cid);k.ind.splice(k.ind.findIndex(x=>x.id==iid),1);ieOpen.add(cid)};if(!confirmLoss(f,"Hapus indikator ini?"))return;commit(f,"Indikator dihapus")},
ieMI(v){const[cid,iid,d]=v.split("|");commit(m=>{const c=fc(m,cid);if(!mv(c.ind,c.ind.findIndex(x=>x.id==iid),+d))return false;ieOpen.add(cid)})},
ieAB(v){const[cid,iid]=v.split("|");commit(m=>{fi(fc(m,cid),iid).b.push({id:uid2(),s:""});ieOpen.add(cid)})},
ieDB(v){const[cid,iid,bid]=v.split("|");commit(m=>{const i=fi(fc(m,cid),iid);i.b.splice(i.b.findIndex(x=>x.id==bid),1);ieOpen.add(cid)})},
ieReset(){if(!S.inst)return;if(!confirm("Kembalikan ke instrumen bawaan (14 komponen / 66 indikator)?\n\nKomponen & indikator tambahan beserta nilainya akan dihapus; perubahan teks bawaan dikembalikan."))return;remap(M,clone(DEFM));S.inst=null;applyInst();save();draw();toast("Instrumen bawaan dipulihkan")},
rmReset(){delete S.cfg.rm;save();draw();toast("Rumus bawaan dipulihkan")},
ieExp(){const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([JSON.stringify({app:"pkg-instrumen",v:1,m:M,rm:S.cfg.rm||null},null,1)],{type:"application/json"}));a.download="Instrumen_PKG_"+nInd()+"indikator.json";document.body.append(a);a.click();a.remove();toast("Instrumen diekspor")},
ieImp(){const f=document.createElement("input");f.type="file";f.accept=".json,application/json";f.onchange=()=>{const r=new FileReader();r.onload=()=>{try{const o=JSON.parse(r.result);if(o.app!="pkg-instrumen"||!valid(o.m))throw 0;const f2=m=>{m.length=0;o.m.forEach(x=>m.push(clone(x)))};if(!confirmLoss(f2,"Ganti instrumen saat ini dengan file ini?"))return;commit(f2,"Instrumen diimpor");if(o.rm){S.cfg.rm=o.rm;save();draw()}}catch(x){toast("File instrumen tidak valid")}};r.readAsText(f.files[0])};f.click()}});
/* ---------- hubungan dengan fitur lain ---------- */
const _init=init;init=function(){const r=_init.apply(this,arguments);applyInst();return r};
const _prno=A.prno;A.prno=function(){if(!sameDef()){toast("Instrumen/rumus sudah diubah — dicetak dengan gaya Modern");return A.prn()}return _prno.apply(this,arguments)};
const _vi=V.i;V.i=function(){return'<div class="row" style="margin:0 0 12px"><button class="btn s" data-a="go" data-v="ie">✏️ Kelola Instrumen (edit / tambah / hapus)</button>'+(sameDef()?"":'<span class="ch2">Instrumen/rumus disesuaikan</span>')+'</div>'+_vi.apply(this,arguments)};
const _vc=V.c;V.c=function(){return(sameDef()?"":'<div class="card" style="border-left:4px solid #d97706"><small>Instrumen atau rumus sudah disesuaikan, jadi <b>Cetak Original (Excel)</b> memakai gaya Modern. Cetak Modern tetap lengkap dan otomatis mengikuti instrumen terbaru.</small></div>')+_vc.apply(this,arguments)};
NAV.splice(NAV.findIndex(n=>n[0]=="i")+1,0,["ie","Kelola Instrumen","list"]);
applyInst();draw();
})();
</script>
<script>if("serviceWorker" in navigator){addEventListener("load",function(){navigator.serviceWorker.register("./sw.js")})}</script>
</body></html>
